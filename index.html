<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMG Collage Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@300;400;700&display=swap">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="window">

  <div class="window-bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="window-title">IMG Collage Editor</span>
    <span class="spacer"></span>
    <span class="window-meta" id="windowMeta">—</span>
  </div>

  <div class="workspace">

    <!-- ══ 01 LAYOUT ══ -->
    <aside class="panel">
      <div class="panel-tab" data-panel="layout"><span class="tab-group">01</span><span class="tab-name">LAYOUT</span></div>
      <div class="panel-body" data-panel="layout">
        <div class="panel-scroll">

          <section class="block">
            <h2 class="block-title">배치 방식</h2>
            <div class="seg" id="modeSeg">
              <button class="seg-btn is-active" data-mode="auto" type="button">원본 그대로</button>
              <button class="seg-btn" data-mode="template" type="button">캔버스 비율</button>
            </div>
          </section>

          <section class="block" id="autoBlock">
            <h2 class="block-title">방향</h2>
            <div class="seg" id="dirSeg">
              <button class="seg-btn" data-dir="h" type="button">가로로 붙이기</button>
              <button class="seg-btn is-active" data-dir="v" type="button">세로로 붙이기</button>
            </div>
            <p class="block-note">원본 비율을 지킨 채 여백 없이 이어 붙입니다. 한 장이면 원본 크기 그대로입니다.</p>
          </section>

          <section class="block is-hidden" id="ratioBlock">
            <h2 class="block-title">캔버스 비율</h2>
            <div class="chips" id="ratioChips"></div>
            <div class="pair">
              <span class="pair-label">비율</span>
              <input type="number" id="ratioW" min="1" max="200" value="1">
              <span class="pair-sep">:</span>
              <input type="number" id="ratioH" min="1" max="200" value="1">
            </div>
            <div class="pair">
              <span class="pair-label">크기</span>
              <input type="number" id="pxW" min="80" max="12000" step="10" value="1600">
              <span class="pair-sep">×</span>
              <input type="number" id="pxH" min="80" max="12000" step="10" value="1600">
              <span class="pair-unit">px</span>
            </div>
            <p class="block-note">한쪽 값을 바꾸면 비율에 맞춰 나머지가 따라갑니다.</p>
          </section>

          <section class="block is-hidden" id="templateBlock">
            <h2 class="block-title">템플릿</h2>
            <div class="templates" id="templates"></div>
            <p class="block-note" id="templateNote"></p>
          </section>

          <section class="block">
            <h2 class="block-title">간격 &amp; 테두리</h2>
            <label class="slider">
              <span class="slider-label">사진 사이 간격</span>
              <span class="slider-row">
                <input type="range" id="gap" min="0" max="120" value="0">
                <input type="number" class="num" id="gapNum" min="0" max="120" step="1" value="0">
              </span>
            </label>
            <label class="check">
              <input type="checkbox" id="marginOn">
              <span>바깥 여백도 같이 주기</span>
            </label>
            <label class="check">
              <input type="checkbox" id="borderOn">
              <span>테두리 선 보이기</span>
            </label>
            <div class="sub is-hidden" id="borderOpts">
              <label class="slider">
                <span class="slider-label">굵기</span>
                <span class="slider-row">
                  <input type="range" id="borderW" min="1" max="40" value="4">
                    <input type="number" class="num" id="borderWNum" min="1" max="40" step="1" value="4">
                </span>
              </label>
              <div class="field field-color">
                <span>선 색상</span>
                <span class="color-pair">
                  <input type="text" class="hex" id="borderColorHex" maxlength="7" value="#000000">
                  <input type="color" id="borderColor" value="#000000">
                </span>
              </div>
              <label class="check">
                <input type="checkbox" id="borderOuter" checked>
                <span>가장 바깥 테두리도 그리기</span>
              </label>
            </div>
          </section>

          <section class="block">
            <h2 class="block-title">배경</h2>
            <div class="field field-color">
              <span>배경색</span>
              <span class="color-pair">
                <input type="text" class="hex" id="bgColorHex" maxlength="7" value="#FFFFFF">
                <input type="color" id="bgColor" value="#ffffff">
              </span>
            </div>
          </section>

          <section class="block block-last">
            <h2 class="block-title">사진</h2>
            <button class="btn" id="addPhoto" type="button">＋ 사진 추가</button>
            <div class="thumbs" id="thumbs"></div>
            <div class="props" id="photoProps"></div>
          </section>

        </div>
      </div>
    </aside>

    <!-- ══ 02 PREVIEW ══ -->
    <main class="panel stage">
      <div class="panel-tab" data-panel="preview"><span class="tab-group">02</span><span class="tab-name">PREVIEW</span></div>
      <div class="panel-body stage-body" data-panel="preview">
        <div class="stage-inner" id="stageInner">
          <div class="canvas-box" id="canvasBox">
            <canvas id="canvas"></canvas>
            <canvas id="overlay"></canvas>
          </div>
        </div>
        <div class="stage-foot">
          <label class="check check-sm">
            <input type="checkbox" id="gridOn"><span>그리드</span>
          </label>
          <span class="grid-dims">
            <input type="number" id="gridCols" min="1" max="24" value="3">
            <span>×</span>
            <input type="number" id="gridRows" min="1" max="24" value="3">
          </span>
          <label class="check check-sm">
            <input type="checkbox" id="snapOn"><span>스냅</span>
          </label>
          <button class="mini-btn is-hidden" id="viewReset" type="button">화면 맞춤</button>
          <span class="spacer"></span>
          <span class="stage-tip">빈 칸을 클릭해 사진 넣기 · 드래그로 이동 · 휠로 확대 · 두 손가락(또는 Ctrl+휠)으로 화면 확대</span>
        </div>
      </div>
    </main>

    <!-- ══ 03 ELEMENTS ══ -->
    <aside class="panel">
      <div class="panel-tab" data-panel="elements"><span class="tab-group">03</span><span class="tab-name">ELEMENTS</span></div>
      <div class="panel-body" data-panel="elements">

        <div class="panel-scroll">
          <section class="block">
            <div class="block-head">
              <h2 class="block-title">레이어</h2>
              <div class="menu">
                <button class="menu-btn" id="addMenuBtn" type="button" title="요소 추가"
                        aria-haspopup="true" aria-expanded="false">+</button>
                <div class="menu-list is-hidden" id="addMenu" role="menu">
                  <button type="button" data-add="sticker" role="menuitem"><span>▣</span>스티커</button>
                  <button type="button" data-add="text" role="menuitem"><span>T</span>텍스트</button>
                  <button type="button" data-add="rect" role="menuitem"><span>▭</span>사각형</button>
                  <button type="button" data-add="circle" role="menuitem"><span>◯</span>원</button>
                </div>
              </div>
            </div>
            <ul class="layers" id="layerList"></ul>
          </section>

          <section class="block block-grow block-last">
            <div id="props" class="props"></div>
          </section>
        </div>

        <div class="panel-foot">
          <h2 class="block-title">내보내기</h2>
          <div class="seg" id="formatSeg">
            <button class="seg-btn is-active" data-format="png" type="button">PNG</button>
            <button class="seg-btn" data-format="jpeg" type="button">JPEG</button>
            <button class="seg-btn" data-format="webp" type="button">WEBP</button>
          </div>
          <label class="slider is-hidden" id="qualityWrap">
            <span class="slider-label">품질</span>
            <span class="slider-row">
              <input type="range" id="quality" min="40" max="100" value="92">
              <input type="number" class="num" id="qualityNum" min="40" max="100" step="1" value="92">
            </span>
          </label>
          <button class="btn btn-primary" id="exportBtn" type="button">이미지 저장</button>
          <button class="btn btn-ghost" id="resetBtn" type="button">전체 초기화</button>
        </div>

      </div>
    </aside>

  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
